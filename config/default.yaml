# =============================================================================
# MC-MOT default configuration (committed)
#
# Precedence, lowest to highest:
#   code defaults  ->  config/default.yaml  ->  config/local.yaml  ->  .env  ->  environment
#
# Do NOT edit this file for machine-specific values. Copy config/local.example.yaml
# to config/local.yaml (gitignored) and override only what you need there.
#
# Every value here is also reachable as an environment variable, e.g.
#   $env:MCMOT__IDENTITY__TAU_ACCEPT = "0.62"
# =============================================================================

env: dev

paths:
  # Relative paths are resolved against the project root.
  data_dir: data
  models_dir: models
  logs_dir: logs

logging:
  level: INFO
  console_format: pretty        # pretty | json
  console_colors: true
  file_enabled: true
  file_name: mcmot.jsonl        # written to paths.logs_dir
  file_max_bytes: 10485760      # 10 MiB per file
  file_backup_count: 5
  # Per-frame data is aggregated instead of logged line-by-line. At 25 FPS across
  # 3 cameras, unthrottled detection logs would be ~75 lines/second of noise.
  metrics_interval_s: 1.0
  # Third-party loggers that are chatty at INFO. They still route through our
  # formatter, so nothing is lost — only the volume is reduced.
  silence:
    uvicorn.access: WARNING   # our middleware emits richer access logs
    httpx: WARNING            # logs a line per outbound request
    multipart: WARNING        # logs a line per upload chunk

device:
  prefer: auto                  # auto | cuda | cpu
  index: 0
  allow_fp16: true
  allow_cpu_fallback: true
  # Refuse to start on CUDA if less than this is free; prevents mid-stream OOM.
  min_free_vram_mb: 1024
  warmup_iterations: 3

detector:
  name: yolo11
  # Resolved against paths.models_dir. Swap to yolo11s.pt for better accuracy on
  # small / distant / partially occluded people at roughly twice the latency.
  weights: yolo11n.pt
  conf_threshold: 0.35
  iou_threshold: 0.5
  image_size: 640
  classes: [0]                  # COCO class 0 == person
  max_detections: 100
  half: true                    # ignored when the device cannot do FP16

tracker:
  name: bytetrack
  track_high_thresh: 0.5        # first association pass
  track_low_thresh: 0.1         # ByteTrack's low-score recovery pass
  new_track_thresh: 0.6
  match_thresh: 0.8             # IoU threshold for association
  track_buffer: 30              # frames a lost track survives before deletion
  min_box_area: 100
  frame_rate: 25

reid:
  name: osnet_ain_x1_0
  weights: osnet_ain_x1_0.pth   # resolved against paths.models_dir
  backend: torch                # torch | onnx
  embedding_dim: 512
  input_height: 256
  input_width: 128
  batch_size: 16
  half: true
  # Crop quality gate. Bad crops do not merely waste GPU time, they poison the
  # per-track identity vote, so they are rejected before embedding.
  quality:
    min_width: 48
    min_height: 96
    # width / height. Measured against real yolo11n output: standing people run
    # 0.22-0.38, and a partially-occluded person at a frame edge came in at 0.215.
    # An 0.25 floor silently discarded them, so this is deliberately loose --
    # truncation and blur are the checks that should reject a bad crop, not shape.
    min_aspect_ratio: 0.18
    max_aspect_ratio: 0.85
    blur_threshold: 45.0        # variance of Laplacian; lower == blurrier
    max_truncation: 0.15        # fraction of the box allowed outside the frame

identity:
  tau_accept: 0.55              # minimum cosine similarity to consider a match
  tau_margin: 0.06              # best - second_best_person; blocks confident mismatches
  top_k: 10                     # FAISS neighbours retrieved per query
  per_person_top: 3             # per-person score = mean of its best N hits
  # Track-level temporal voting. Identity is a property of a track, not a frame.
  vote_window: 15
  vote_min_agree: 5             # consecutive agreeing votes required to claim an identity
  vote_min_reject: 8            # stricter opposing run required to lose a claimed identity
  reid_interval_frames: 10      # embed every Nth frame per unlocked track
  locked_reid_interval_frames: 60   # heartbeat rate once an identity is locked
  max_embeddings_per_person: 20
  # Registration frame selection.
  registration:
    target_frames: 30
    min_accepted_frames: 8
    max_accepted_frames: 20
    # Drop near-identical crops above this similarity. Deliberately very high:
    # OSNet scores *different* views of the same person at 0.97-0.99, so a 0.97
    # threshold discarded genuine pose variety and collapsed a 30-frame enrolment
    # to a single embedding. Only truly redundant frames exceed 0.995. This is a
    # preference, not a filter -- see IdentityService._select_gallery.
    duplicate_similarity: 0.995
    representative_images: 3

storage:
  database_url: sqlite:///{data_dir}/mcmot.db
  sqlite_wal: true
  echo_sql: false
  # Exact cosine search (IndexFlatIP over L2-normalised vectors). Exhaustive on
  # purpose: at gallery scale it costs microseconds, and an approximate index
  # would trade that for recall loss, which here means a wrong name on a person.
  vector_index_path: "{data_dir}/index/gallery.faiss"
  blob_dir: "{data_dir}/persons"
  # SQLite is the source of truth; the index is a rebuildable cache.
  rebuild_index_on_mismatch: true

camera:
  width: 1280
  height: 720
  target_fps: 25
  read_timeout_s: 5.0
  open_timeout_s: 10.0
  buffer_size: 1                # OpenCV internal buffer; >1 accumulates latency
  rtsp_transport: tcp           # tcp | udp
  reconnect_initial_delay_s: 1.0
  reconnect_max_delay_s: 30.0
  max_reconnect_attempts: 0     # 0 == retry forever with backoff

pipeline:
  queue_size: 1                 # latest-frame-wins; never buffer, always drop
  drop_stale_frames: true
  max_stale_age_s: 0.5
  jpeg_quality: 75
  stream_max_width: 960         # downscale before encoding for the browser
  annotate: true

api:
  host: 0.0.0.0
  port: 8000
  docs_enabled: true
  cors_origins: []
  request_timeout_s: 30.0
