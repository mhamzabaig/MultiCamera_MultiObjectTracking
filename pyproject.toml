[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcmot"
version = "0.1.0"
description = "Production-grade Multi-Camera Multi-Object Tracking and Person Re-Identification platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "M Hamza Baig", email = "mhamzabaig1234@gmail.com" }]

# ---------------------------------------------------------------------------
# Phase 1 runtime dependencies.
#
# Deliberately light: the ML stack lands in later phases via the `ml` extra so
# that the foundation (config / logging / errors / device / API) stays testable
# on a machine with no CUDA and no model weights.
#
# NOTE: torch is NOT listed here. Windows + CUDA 12.1 wheels only exist on the
# PyTorch index, which cannot be expressed as a plain dependency. Install it via
# `scripts/setup_env.ps1` (see docs/deployment.md).
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyYAML>=6.0.2,<7.0",
    "structlog>=24.4,<25.0",
    "jinja2>=3.1.4,<4.0",
    "python-multipart>=0.0.12,<0.1",
    "numpy>=1.26,<2.2",
]

[project.optional-dependencies]
# Extras are split by phase so each one installs without dragging in the next.
# In particular `storage` must not pull torch: ultralytics depends on it, and the
# CUDA wheel is a 2.3 GB download.
storage = [
    "SQLAlchemy>=2.0.36,<2.1",
    "faiss-cpu>=1.9,<1.13",
]
# Phases 3-5: detector, tracker, ReID. Requires torch (see scripts/setup_env.ps1).
ml = [
    "ultralytics>=8.3,<8.4",
    "opencv-python>=4.10,<4.11",
    # Ultralytics' tracker needs this for Hungarian assignment but declares it
    # lazily and will pip-install it AT RUNTIME if absent. Pinned here so the
    # dependency is explicit and that never fires. See YOLO_AUTOINSTALL below.
    "lap>=0.5.12,<0.6",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<0.29",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
mcmot = "mcmot.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmot"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # prefer pathlib
    "RET",  # return consistency
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "D",    # pydocstyle
    "ANN",  # type annotations
]
ignore = [
    "D107",   # __init__ docstring (documented at class level instead)
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is legitimate in DI / config plumbing
]

[tool.ruff.lint.per-file-ignores]
# ARG: pytest fixtures are frequently requested for their side effects alone
# (isolating the environment, patching a module) and never referenced by name.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN", "ARG"]
"scripts/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
packages = ["mcmot"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# faiss ships no type stubs; the rest are checked but not annotated end-to-end.
module = ["torch.*", "yaml.*", "structlog.*", "faiss.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires a working CUDA device",
    "slow: excluded from the default fast feedback loop",
]
filterwarnings = ["error::DeprecationWarning:mcmot.*"]

[tool.coverage.run]
source = ["src/mcmot"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
