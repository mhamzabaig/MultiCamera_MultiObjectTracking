{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="row">
    <div class="field" style="max-width:190px">
      <label for="level">Minimum level</label>
      <select id="level">
        <option value="">All</option>
        <option value="debug">Debug</option>
        <option value="info" selected>Info</option>
        <option value="warning">Warning</option>
        <option value="error">Error</option>
      </select>
    </div>
    <div class="field" style="max-width:150px">
      <label for="limit">Lines</label>
      <input type="number" id="limit" value="200" min="10" max="2000" step="10">
    </div>
    <div class="field" style="max-width:220px">
      <label for="filter">Filter (event or text)</label>
      <input type="text" id="filter" placeholder="camera, identity, …" autocomplete="off">
    </div>
    <div class="field" style="max-width:160px">
      <label for="live">Follow</label>
      <select id="live">
        <option value="1" selected>Live (3s)</option>
        <option value="0">Paused</option>
      </select>
    </div>
    <button id="refresh">Refresh</button>
  </div>
  <p class="hint" id="meta">Loading…</p>
</div>

<div class="panel">
  <div class="logs" id="logs"><div class="empty">Loading…</div></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js"></script>
{% endblock %}
